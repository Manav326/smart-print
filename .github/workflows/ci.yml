name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**", "feat/**", "security/**"]
  pull_request:
    branches: [main, "feature/**", "feat/**"]

permissions:
  contents: read

env:
  SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL }}

jobs:
  backup_crypto:
    name: Encrypted backup and restore-drill script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell syntax and backup cryptography
        shell: pwsh
        run: ./scripts/qa/backup-crypto.tests.ps1

  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install portal dependencies
        id: portal_dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate every QA harness JavaScript module
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          for file in scripts/qa/*.mjs; do
            echo "Syntax-checking $file"
            node --check "$file"
          done
      - name: Test every QA harness regression file
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: node --test --test-concurrency=1 --test-reporter=./scripts/qa/live-node-test-reporter.mjs scripts/qa/*.test.mjs
      - name: Test every Portal logic regression file
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=./scripts/qa/live-node-test-reporter.mjs apps/portal/tests/*.test.ts
      - name: Install Chromium for real-browser appearance and viewport checks
        id: chromium_install
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: npx --yes --package=playwright@1.56.1 playwright install --with-deps chromium
      - name: Validate Photo Studio browser runner syntax
        if: ${{ !cancelled() && steps.chromium_install.outcome == 'success' }}
        run: node --check apps/portal/tests/photo-studio.browser.mjs
      - name: Run Photo Studio real-browser acceptance suite
        if: ${{ !cancelled() && steps.chromium_install.outcome == 'success' }}
        env:
          VITE_API_BASE_URL: ""
        run: |
          mkdir -p artifacts/photo-studio-browser
          npx --yes --package=playwright@1.56.1 -c 'PLAYWRIGHT_MODULE_DIR="$(dirname "$(readlink -f "$(command -v playwright)")")" SMARTPRINT_PHOTO_STUDIO_ARTIFACT_DIR=artifacts/photo-studio-browser node apps/portal/tests/photo-studio.browser.mjs'
      - name: Upload Photo Studio browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-photo-studio-browser-qa
          path: artifacts/photo-studio-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate mixed-batch refund browser runner syntax
        if: ${{ !cancelled() && steps.chromium_install.outcome == 'success' }}
        run: node --check apps/portal/tests/mixed-batch-refund.browser.mjs
      - name: Run mixed-type batch page rejection and complete refund acceptance (web shop)
        if: ${{ !cancelled() && steps.chromium_install.outcome == 'success' }}
        env:
          VITE_API_BASE_URL: ""
          SMARTPRINT_MIXED_BATCH_REFUND_APP: web
          SMARTPRINT_MIXED_BATCH_REFUND_ARTIFACT_DIR: artifacts/mixed-batch-refund-web
        run: |
          npx --yes --package=playwright@1.56.1 -c 'PLAYWRIGHT_MODULE_DIR="$(dirname "$(readlink -f "$(command -v playwright)")")" node apps/portal/tests/mixed-batch-refund.browser.mjs'
      - name: Upload web mixed-batch refund evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-mixed-batch-refund-web-qa
          path: artifacts/mixed-batch-refund-web/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify theme persistence and responsive layouts in Chromium
        if: ${{ !cancelled() && steps.chromium_install.outcome == 'success' }}
        run: |
          npx --yes --package=playwright@1.56.1 -c 'PLAYWRIGHT_MODULE_DIR="$(dirname "$(readlink -f "$(command -v playwright)")")" node apps/portal/tests/theme-responsive.browser.mjs'
      - name: Upload responsive browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-responsive-browser-qa
          path: artifacts/theme-responsive/
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck portal and shared packages
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: pnpm typecheck
      - name: Build portal and shared packages
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: pnpm build
      - name: Ensure production portal build excludes QA-only Photo Studio fixture
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e apps/portal/dist/tests/photo-studio.browser.html ]]; then
            echo "QA-only Photo Studio fixture leaked into the normal production portal build." >&2
            exit 1
          fi
          echo "PASS: normal portal build does not publish the QA-only Photo Studio fixture"

      - name: Package exact-commit production portal artifact
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/web-production
          cp -R apps/portal/dist/. artifacts/web-production/
          node scripts/qa/create-qa-artifact-manifest.mjs artifacts/web-production web

      - name: Upload production portal artifact for local QA
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-web-production
          path: artifacts/web-production/
          if-no-files-found: error
          retention-days: 30

      - name: Build isolated Photo Studio QA fixture artifact
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        shell: bash
        env:
          VITE_ENABLE_PHOTO_STUDIO_QA: "true"
        run: |
          set -euo pipefail
          pnpm --filter @smart-print/portal build
          if [[ ! -f apps/portal/dist/tests/photo-studio.browser.html ]]; then
            echo "The QA-only Photo Studio browser fixture was not emitted." >&2
            exit 1
          fi
      - name: Package exact-commit Photo Studio QA fixture
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/web-photo-studio-qa
          cp -R apps/portal/dist/. artifacts/web-photo-studio-qa/
          node scripts/qa/create-qa-artifact-manifest.mjs artifacts/web-photo-studio-qa webqa
      - name: Upload Photo Studio QA fixture for local headed testing
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-web-photo-studio-qa
          path: artifacts/web-photo-studio-qa/
          if-no-files-found: error
          retention-days: 30
      - name: Typecheck native desktop frontend
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: pnpm --filter @smart-print/desktop typecheck
      - name: Build native desktop frontend
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        run: pnpm --filter @smart-print/desktop build
      - name: Validate portal Nginx proxy configuration
        if: ${{ !cancelled() }}
        run: docker run --rm --add-host smart-print-api:127.0.0.1 -v "$GITHUB_WORKSPACE/apps/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Enforce the dedicated SmartPrint API upstream
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          count="$(grep -Fc 'proxy_pass http://smart-print-api:8080' apps/portal/nginx.conf)"
          if [[ "$count" -ne 3 ]] || grep -Fq 'proxy_pass http://api:8080' apps/portal/nginx.conf; then
            echo "All Nginx API, downloads, and health routes must use smart-print-api." >&2
            exit 1
          fi
      - name: Validate production Compose configuration
        if: ${{ !cancelled() }}
        env:
          PUBLIC_BASE_URL: https://example.invalid
          IMAGE_NAMESPACE: ghcr.io/compose-validation
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate local development Compose configuration
        if: ${{ !cancelled() }}
        env:
          POSTGRES_DB: qrtoprint
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: local-ci-validation-only
          AUTH_SIGNING_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh
          DOCUMENTS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          PUBLIC_BASE_URL: https://example.invalid
        run: docker compose -f compose.local.yml config --quiet

  api_dotnet:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build cloud API
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        run: dotnet build src/SmartPrint.Api/SmartPrint.Api.csproj --configuration Release
      - name: Run API unit and model tests
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        run: dotnet test tests/SmartPrint.Api.Tests/SmartPrint.Api.Tests.csproj --configuration Release --logger "console;verbosity=normal" -- "xUnit.ReporterSwitch=verbose" "xUnit.ShowLiveOutput=true" "xUnit.StopOnFail=false" "xUnit.ParallelizeTestCollections=false" "xUnit.MaxParallelThreads=1"

  agent_dotnet:
    outputs:
      agent_package_ready: ${{ steps.agent_package_upload.outcome == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate PowerShell deployment scripts
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem scripts -Filter *.ps1 -Recurse
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($scriptFile.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)"
              }
              throw "PowerShell syntax validation failed for $($scriptFile.Name)."
            }
          }
          $helpChecks = @(
            @{ Path = "scripts/qa/run-smartprint-qa.ps1"; Expected = "-AndroidAppOnly" },
            @{ Path = "scripts/qa/run-smartprint-native-local.ps1"; Expected = "-AndroidDeviceSerial" },
            @{ Path = "scripts/qa/run-smartprint-headed-playwright.ps1"; Expected = "-RunCustomerUploadWorkflow" },
            @{ Path = "scripts/qa/desktop-open-smoke.ps1"; Expected = "-RequireDevTools" },
            @{ Path = "scripts/qa/windows-installer-lifecycle.ps1"; Expected = "-InstallerV1" },
            @{ Path = "scripts/qa/test-published-apps.ps1"; Expected = "-InstallPublishedAndroidApk" }
          )
          foreach ($check in $helpChecks) {
            $helpOutput = & pwsh -NoProfile -File $check.Path -Help 2>&1 | Out-String
            $helpExitCode = $LASTEXITCODE
            if ($helpExitCode -ne 0) {
              throw "Help invocation failed for $($check.Path) with exit code $helpExitCode."
            }
            if (-not $helpOutput.Contains($check.Expected)) {
              throw "Help output for $($check.Path) did not document $($check.Expected)."
            }
            Write-Host "PASS: $($check.Path) -Help"
          }
      - name: Build Windows Print Agent
        id: agent_build
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        run: dotnet build src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release
      - name: Verify the real Microsoft Print to PDF Windows queue
        id: pdf_queue
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $queueName = "Microsoft Print to PDF"
          $printer = Get-Printer -Name $queueName -ErrorAction SilentlyContinue
          if (-not $printer) {
            $feature = Get-WindowsOptionalFeature -Online -FeatureName "Printing-PrintToPDFServices-Features" -ErrorAction Stop
            if ($feature.State -ne "Enabled") {
              Enable-WindowsOptionalFeature -Online -FeatureName "Printing-PrintToPDFServices-Features" -All -NoRestart -ErrorAction Stop | Out-Null
              Restart-Service -Name Spooler -Force
              Start-Sleep -Seconds 5
            }
            $printer = Get-Printer -Name $queueName -ErrorAction SilentlyContinue
          }
          if (-not $printer) {
            throw "The real Microsoft Print to PDF queue is unavailable on this Windows runner. Refusing to substitute a mock printer."
          }
          if ($printer.DriverName -notmatch "Microsoft Print To PDF") {
            throw "Unexpected printer driver '$($printer.DriverName)'; this integration test requires Microsoft's actual Print to PDF driver."
          }
          Write-Host "Verified installed Windows printer queue: $($printer.Name)"
          Write-Host "Driver: $($printer.DriverName)"
          Write-Host "Port: $($printer.PortName)"
      - name: Create a second Windows queue on the same port for multi-printer validation
        id: secondary_queue
        if: ${{ !cancelled() && steps.pdf_queue.outcome == 'success' }}
        shell: pwsh
        run: |
          $primary = Get-Printer -Name "Microsoft Print to PDF" -ErrorAction Stop
          $secondaryName = "SmartPrint CI Secondary Queue"
          Remove-Printer -Name $secondaryName -ErrorAction SilentlyContinue
          Add-Printer -Name $secondaryName -DriverName $primary.DriverName -PortName $primary.PortName -ErrorAction Stop
          $secondary = Get-Printer -Name $secondaryName -ErrorAction Stop
          if ($secondary.DriverName -ne $primary.DriverName -or $secondary.PortName -ne $primary.PortName) {
            throw "The secondary printer must share the Microsoft driver and Windows port."
          }
          Write-Host "Primary queue: $($primary.Name) -> $($primary.PortName)"
          Write-Host "Secondary queue: $($secondary.Name) -> $($secondary.PortName)"
      - name: Run Windows Agent unit and real spooler integration tests
        id: agent_tests
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        env:
          SMARTPRINT_RUN_WINDOWS_SPOOLER_INTEGRATION: ${{ steps.pdf_queue.outcome == 'success' && '1' || '0' }}
          SMARTPRINT_RUN_MULTI_QUEUE_INTEGRATION: ${{ steps.secondary_queue.outcome == 'success' && '1' || '0' }}
        run: dotnet test tests/SmartPrint.Agent.Tests/SmartPrint.Agent.Tests.csproj --configuration Release --logger "console;verbosity=normal" -- "xUnit.ReporterSwitch=verbose" "xUnit.ShowLiveOutput=true" "xUnit.StopOnFail=false" "xUnit.ParallelizeTestCollections=false" "xUnit.MaxParallelThreads=1"
      - name: Remove the temporary secondary Windows queue
        if: always()
        shell: pwsh
        run: Remove-Printer -Name "SmartPrint CI Secondary Queue" -ErrorAction SilentlyContinue
      - name: Publish self-contained Windows Agent
        id: agent_publish
        if: ${{ !cancelled() && steps.setup_dotnet.outcome == 'success' }}
        run: dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
      - name: Smoke-test non-interactive Agent pairing status command
        if: ${{ !cancelled() && steps.agent_publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $agent = Join-Path (Resolve-Path artifacts/agent) "SmartPrint.Agent.exe"
          $agentProcess = Start-Process -FilePath $agent -ArgumentList @("--check-pairing") -NoNewWindow -Wait -PassThru
          if ($agentProcess.ExitCode -ne 2) {
            throw "Expected an unpaired Windows Agent to exit with code 2, got $($agentProcess.ExitCode)."
          }
      - name: Add Agent setup scripts and guide
        if: ${{ !cancelled() && steps.agent_publish.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/agent | Out-Null
          Copy-Item scripts/pair-agent.ps1, scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, scripts/verify-agent-local.ps1, src/SmartPrint.Agent/appsettings.example.json, src/SmartPrint.Agent/README.md artifacts/agent/
      - name: Upload Windows Agent package
        id: agent_package_upload
        if: ${{ always() && steps.agent_publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-agent-win-x64
          path: artifacts/agent/
          if-no-files-found: error
          retention-days: 30

  windows_desktop:
    outputs:
      desktop_package_ready: ${{ steps.desktop_package_upload.outcome == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        id: desktop_dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate local Photo Studio and mixed-batch QA runner help and syntax
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          node --check apps/portal/tests/photo-studio.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Photo Studio browser runner syntax validation failed." }
          node --check apps/portal/tests/mixed-batch-refund.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Mixed-batch refund browser runner syntax validation failed." }
          node --check scripts/qa/serve-static-portal.mjs
          if ($LASTEXITCODE -ne 0) { throw "Static Portal QA server syntax validation failed." }
          node --check scripts/qa/create-qa-artifact-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw "QA artifact manifest generator syntax validation failed." }
          pwsh -NoProfile -File scripts/qa/photo-studio-test.ps1 -Help
          if ($LASTEXITCODE -ne 0) { throw "Photo Studio test runner help failed." }
          pwsh -NoProfile -File scripts/qa/mixed-batch-refund-test.ps1 -Help
          if ($LASTEXITCODE -ne 0) { throw "Mixed-batch refund test runner help failed." }
          pwsh -NoProfile -File scripts/qa/run-smartprint-platform-qa.ps1 -Help
          if ($LASTEXITCODE -ne 0) { throw "Unified platform QA runner help failed." }
          pwsh -NoProfile -File scripts/qa/run-smartprint-android-device-tests.ps1 -Help
          if ($LASTEXITCODE -ne 0) { throw "Physical Android QA runner help failed." }
      - name: Install Chromium for Windows Photo Studio and mixed-batch acceptance
        id: browser_chromium_install
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          npx --yes --package=playwright@1.56.1 playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium installation failed." }
      - name: Run Photo Studio browser acceptance on Windows
        if: ${{ !cancelled() && steps.browser_chromium_install.outcome == 'success' }}
        shell: pwsh
        env:
          VITE_API_BASE_URL: ""
        run: |
          $cache = (npm config get cache).Trim()
          $module = Get-ChildItem -Path (Join-Path $cache "_npx") -Filter "index.mjs" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\node_modules\\playwright\\index\.mjs$" } |
            Select-Object -First 1
          if (-not $module) { throw "Could not locate the isolated Playwright package installed by npx." }
          New-Item -ItemType Directory -Force -Path artifacts/photo-studio-windows | Out-Null
          $env:PLAYWRIGHT_MODULE_DIR = $module.DirectoryName
          $env:SMARTPRINT_PHOTO_STUDIO_ARTIFACT_DIR = "artifacts/photo-studio-windows"
          node apps/portal/tests/photo-studio.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows Photo Studio browser acceptance failed." }
      - name: Upload Windows Photo Studio browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-photo-studio-windows-browser-qa
          path: artifacts/photo-studio-windows/
          if-no-files-found: warn
          retention-days: 14
      - name: Run mixed-type batch page rejection and complete refund acceptance (Windows desktop renderer)
        if: ${{ !cancelled() && steps.browser_chromium_install.outcome == 'success' }}
        shell: pwsh
        env:
          VITE_API_BASE_URL: ""
          SMARTPRINT_MIXED_BATCH_REFUND_APP: desktop
          SMARTPRINT_MIXED_BATCH_REFUND_ARTIFACT_DIR: artifacts/mixed-batch-refund-windows
        run: |
          $cache = (npm config get cache).Trim()
          $module = Get-ChildItem -Path (Join-Path $cache "_npx") -Filter "index.mjs" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\node_modules\\playwright\\index\.mjs$" } |
            Select-Object -First 1
          if (-not $module) { throw "Could not locate the isolated Playwright package installed by npx." }
          $env:PLAYWRIGHT_MODULE_DIR = $module.DirectoryName
          node apps/portal/tests/mixed-batch-refund.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop mixed-batch refund acceptance failed." }
      - name: Upload Windows desktop mixed-batch refund evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-mixed-batch-refund-windows-desktop-qa
          path: artifacts/mixed-batch-refund-windows/
          if-no-files-found: warn
          retention-days: 14
      - name: Build desktop frontend
        id: desktop_frontend_build
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        run: pnpm --filter @smart-print/desktop build
      - name: Compile native Windows desktop host
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Run native Windows desktop host tests
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build native Windows desktop executable
        id: desktop_executable_build
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' && steps.desktop_frontend_build.outcome == 'success' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SMARTPRINT_PUBLIC_BASE_URL)) {
            throw "Configure the SMARTPRINT_PUBLIC_BASE_URL Actions variable before building the desktop application."
          }
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL

          # Build the distributable executable with the production Tauri config.
          # This binary must never contain the CI-only remote-debugging port.
          pnpm --filter @smart-print/desktop exec tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint production desktop build failed." }
          $nativeExe = "apps/desktop/src-tauri/target/release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $nativeExe)) { throw "The SmartPrint production desktop executable was not produced." }
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          Copy-Item -LiteralPath $nativeExe -Destination "artifacts/desktop/SmartPrint.Desktop.exe"
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release" -Filter "*.dll" -File |
            Copy-Item -Destination "artifacts/desktop" -Force

          # Build a separate, non-distributable executable with WebView2 DevTools
          # enabled only for this CI smoke test. Keep it in a temporary Cargo
          # target directory so it cannot overwrite or leak into the installer.
          $desktopSmokeConfig = Join-Path $env:RUNNER_TEMP "smartprint-desktop-smoke-tauri.conf.json"
          ./scripts/qa/prepare-desktop-smoke-config.ps1 -OutputPath $desktopSmokeConfig
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the isolated desktop smoke configuration." }
          $desktopSmokeTarget = Join-Path $env:RUNNER_TEMP "smartprint-desktop-smoke-target"
          $previousCargoTargetDir = $env:CARGO_TARGET_DIR
          $previousViteApiBaseUrl = $env:VITE_API_BASE_URL
          try {
            $env:CARGO_TARGET_DIR = $desktopSmokeTarget
            # This is a test-only binary. It must never start with a user's
            # real shop/API origin; all /api calls are intercepted by the
            # synthetic Playwright fixtures after WebView2 exposes CDP.
            $env:VITE_API_BASE_URL = "https://example.invalid"
            pnpm --filter @smart-print/desktop exec tauri build --config "$desktopSmokeConfig" --no-bundle --ci
            if ($LASTEXITCODE -ne 0) { throw "SmartPrint CI-only desktop smoke build failed." }
          }
          finally {
            if ([string]::IsNullOrWhiteSpace($previousCargoTargetDir)) {
              Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
            } else {
              $env:CARGO_TARGET_DIR = $previousCargoTargetDir
            }
            if ([string]::IsNullOrWhiteSpace($previousViteApiBaseUrl)) {
              Remove-Item Env:VITE_API_BASE_URL -ErrorAction SilentlyContinue
            } else {
              $env:VITE_API_BASE_URL = $previousViteApiBaseUrl
            }
          }
          $smokeExe = Join-Path $desktopSmokeTarget "release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $smokeExe)) { throw "The isolated SmartPrint desktop smoke executable was not produced." }
          # Include a separate test-only executable with localhost CDP enabled.
          # The production executable above remains free of remote-debugging flags.
          Copy-Item -LiteralPath $smokeExe -Destination "artifacts/desktop/SmartPrint.Desktop.QA.exe" -Force
          Get-ChildItem -Path (Join-Path $desktopSmokeTarget "release") -Filter "*.dll" -File |
            Copy-Item -Destination "artifacts/desktop" -Force

      - name: Install and bundle the Microsoft WebView2 Evergreen Runtime
        id: webview2_runtime
        if: ${{ !cancelled() && steps.desktop_executable_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $bootstrapper = "artifacts/desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          New-Item -ItemType Directory -Force -Path "artifacts/desktop" | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper -MaximumRedirection 10
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "The downloaded WebView2 prerequisite did not pass Microsoft Authenticode verification."
          }

          function Find-WebView2RuntimeExecutable {
            $roots = @(
              (Join-Path ${env:ProgramFiles(x86)} "Microsoft\EdgeWebView\Application"),
              (Join-Path ${env:ProgramFiles} "Microsoft\EdgeWebView\Application"),
              (Join-Path ${env:LOCALAPPDATA} "Microsoft\EdgeWebView\Application")
            )
            $candidates = @()
            foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
              foreach ($directory in Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue) {
                try { $version = [version]$directory.Name }
                catch { continue }
                $runtimePath = Join-Path $directory.FullName "msedgewebview2.exe"
                if (Test-Path -LiteralPath $runtimePath -PathType Leaf) {
                  $candidates += [PSCustomObject]@{ Version = $version; Path = $runtimePath }
                }
              }
            }
            return ($candidates | Sort-Object Version -Descending | Select-Object -First 1)
          }

          $runtime = Find-WebView2RuntimeExecutable
          if (-not $runtime) {
            Write-Host "No Evergreen WebView2 Runtime was installed on this runner; installing the verified Microsoft bootstrapper."
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList @("/silent", "/install") -Wait -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) {
              throw "WebView2 Runtime installation failed with exit code $($installer.ExitCode)."
            }
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              $runtime = Find-WebView2RuntimeExecutable
              if ($runtime) { break }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
          }
          if (-not $runtime) {
            throw "Microsoft WebView2 Runtime is still not present after the signed bootstrapper completed."
          }
          $runtimeVersion = (Get-Item -LiteralPath $runtime.Path).VersionInfo.ProductVersion
          Write-Host "PASS: WebView2 Runtime $runtimeVersion is installed at $($runtime.Path)."

      - name: Smoke-test native desktop launch and rendered WebView2 frontend
        if: ${{ !cancelled() && steps.desktop_executable_build.outcome == 'success' && steps.webview2_runtime.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/qa/desktop-open-smoke.ps1 -ExecutablePath (Join-Path $env:RUNNER_TEMP "smartprint-desktop-smoke-target/release/smartprint-desktop.exe") -RequireDevTools
      - name: Run mixed-batch refund acceptance in the actual native Windows WebView2 application
        if: ${{ !cancelled() && steps.desktop_executable_build.outcome == 'success' && steps.webview2_runtime.outcome == 'success' }}
        shell: pwsh
        env:
          VITE_API_BASE_URL: ""
          SMARTPRINT_MIXED_BATCH_REFUND_APP: desktop-native
          SMARTPRINT_WEBVIEW2_DEBUG_PORT: "9238"
          SMARTPRINT_MIXED_BATCH_REFUND_ARTIFACT_DIR: artifacts/mixed-batch-refund-native-windows
        run: |
          $cache = (npm config get cache).Trim()
          $module = Get-ChildItem -Path (Join-Path $cache "_npx") -Filter "index.mjs" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\node_modules\\playwright\\index\.mjs$" } |
            Select-Object -First 1
          if (-not $module) { throw "Could not locate the isolated Playwright package installed by npx." }
          New-Item -ItemType Directory -Force -Path $env:SMARTPRINT_MIXED_BATCH_REFUND_ARTIFACT_DIR | Out-Null
          $env:PLAYWRIGHT_MODULE_DIR = $module.DirectoryName
          node apps/portal/tests/mixed-batch-refund.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native Windows WebView2 mixed-batch refund acceptance failed." }
      - name: Upload native Windows WebView2 mixed-batch refund evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-mixed-batch-refund-native-webview2-qa
          path: artifacts/mixed-batch-refund-native-windows/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate complete Windows QA artifact manifest
        if: ${{ !cancelled() && steps.desktop_executable_build.outcome == 'success' && steps.webview2_runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/qa/create-qa-artifact-manifest.mjs artifacts/desktop windows
          if ($LASTEXITCODE -ne 0) { throw "Windows QA artifact manifest generation failed." }
      - name: Upload Windows desktop package
        id: desktop_package_upload
        if: ${{ always() && steps.desktop_executable_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-desktop-win-x64
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 30

  windows_installer:
    needs: [agent_dotnet, windows_desktop]
    if: ${{ always() && needs.agent_dotnet.outputs.agent_package_ready == 'true' && needs.windows_desktop.outputs.desktop_package_ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download Windows Agent package
        uses: actions/download-artifact@v8
        with:
          name: smart-print-agent-win-x64
          path: artifacts/agent
      - name: Download Windows desktop package
        uses: actions/download-artifact@v8
        with:
          name: smart-print-desktop-win-x64
          path: artifacts/desktop
      - name: Build two versioned SmartPrint installers
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path artifacts/agent-installer | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:SMARTPRINT_PUBLIC_BASE_URL)) {
            throw "Configure the SMARTPRINT_PUBLIC_BASE_URL Actions variable before building the installer."
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $buildId = $env:GITHUB_RUN_NUMBER
          & $iscc "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" /DSmartPrintVersion="0.1.10" "/DSmartPrintBuildId=$buildId-lifecycle-n" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Version N installer compilation failed." }
          Copy-Item "artifacts/agent-installer/SmartPrint-Windows-Setup.exe" "artifacts/agent-installer/SmartPrint-Windows-v1.exe" -Force
          & $iscc "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" /DSmartPrintVersion="0.1.11" "/DSmartPrintBuildId=$buildId-lifecycle-n1" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Version N+1 installer compilation failed." }
          Copy-Item "artifacts/agent-installer/SmartPrint-Windows-Setup.exe" "artifacts/agent-installer/SmartPrint-Windows-v2.exe" -Force
      - name: Verify both Windows beta installers are unsigned
        shell: pwsh
        run: |
          foreach ($installer in @(
            "artifacts/agent-installer/SmartPrint-Windows-v1.exe",
            "artifacts/agent-installer/SmartPrint-Windows-v2.exe"
          )) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "The Windows beta installer must remain intentionally unsigned: $installer"
            }
          }
      - name: Exercise Windows install, reinstall, upgrade, rollback and uninstall lifecycle
        shell: pwsh
        run: |
          ./scripts/qa/windows-installer-lifecycle.ps1 -InstallerV1 "artifacts/agent-installer/SmartPrint-Windows-v1.exe" -InstallerV2 "artifacts/agent-installer/SmartPrint-Windows-v2.exe"
      - name: Upload Windows installer validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-windows-setup-validation
          path: |
            artifacts/agent-installer/SmartPrint-Windows-v1.exe
            artifacts/agent-installer/SmartPrint-Windows-v2.exe
          if-no-files-found: error
          retention-days: 30
  # Keep the original "dotnet" required-check name stable while the
  # independent API, Agent, desktop and installer jobs execute in parallel.
  dotnet:
    if: always()
    needs: [api_dotnet, agent_dotnet, windows_desktop, windows_installer]
    runs-on: ubuntu-latest
    steps:
      - name: Require every split Windows build to pass
        env:
          API_RESULT: ${{ needs.api_dotnet.result }}
          AGENT_RESULT: ${{ needs.agent_dotnet.result }}
          DESKTOP_RESULT: ${{ needs.windows_desktop.result }}
          INSTALLER_RESULT: ${{ needs.windows_installer.result }}
        run: |
          set -euo pipefail
          printf 'API: %s\nAgent: %s\nDesktop: %s\nInstaller: %s\n' \
            "$API_RESULT" "$AGENT_RESULT" "$DESKTOP_RESULT" "$INSTALLER_RESULT"
          test "$API_RESULT" = "success"
          test "$AGENT_RESULT" = "success"
          test "$DESKTOP_RESULT" = "success"
          test "$INSTALLER_RESULT" = "success"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: qrtoprint_test_password
          POSTGRES_DB: qrtoprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrtoprint -d qrtoprint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTPRINT_TEST_POSTGRES: Host=localhost;Port=5432;Database=qrtoprint_test;Username=qrtoprint;Password=qrtoprint_test_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Upgrade a historical PostgreSQL schema and verify operational defaults
        run: dotnet test tests/SmartPrint.Api.Tests/SmartPrint.Api.Tests.csproj --configuration Release --logger "console;verbosity=normal" -- "xUnit.ReporterSwitch=verbose" "xUnit.ShowLiveOutput=true" "xUnit.StopOnFail=false" "xUnit.ParallelizeTestCollections=false" "xUnit.MaxParallelThreads=1"

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        id: java_setup
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        id: gradle_setup
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK tools
        id: android_setup
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Verify Android QA script help
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          emulator_help="$(bash scripts/qa/android-emulator-ci.sh --help)"
          grep -Fq "Usage: bash scripts/qa/android-emulator-ci.sh" <<<"$emulator_help"
          grep -Fq "SMARTPRINT_PUBLIC_BASE_URL" <<<"$emulator_help"
          lifecycle_help="$(bash scripts/qa/android-install-lifecycle.sh --help)"
          grep -Fq "Usage: bash scripts/qa/android-install-lifecycle.sh <APK_N> <APK_N_PLUS_1>" <<<"$lifecycle_help"
          grep -Fq "DESTRUCTIVE SAFETY WARNING" <<<"$lifecycle_help"
          echo "PASS: Android QA helper --help options"
      - name: Set up Node.js and pnpm for isolated Photo Studio WebView fixture
        if: ${{ !cancelled() && steps.android_setup.outcome == 'success' }}
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - name: Set up Node.js for isolated Photo Studio WebView fixture
        if: ${{ !cancelled() && steps.android_setup.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install portal dependencies for Android Photo Studio fixture
        id: android_portal_dependencies
        if: ${{ !cancelled() && steps.android_setup.outcome == 'success' }}
        run: pnpm install --frozen-lockfile --filter @smart-print/portal...
      - name: Build the QA-only Photo Studio fixture (never deployed)
        id: android_photo_fixture_build
        if: ${{ !cancelled() && steps.android_portal_dependencies.outcome == 'success' }}
        env:
          VITE_ENABLE_PHOTO_STUDIO_QA: "true"
        run: |
          pnpm --filter @smart-print/portal build
          test -s apps/portal/dist/tests/photo-studio.browser.html
      - name: Start the QA-only Photo Studio fixture for the Android emulator
        id: android_photo_fixture_server
        if: ${{ !cancelled() && steps.android_photo_fixture_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm --filter @smart-print/portal exec vite preview --host 127.0.0.1 --port 3000 --strictPort > "$RUNNER_TEMP/smartprint-photo-studio-qa-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/smartprint-photo-studio-qa-server.pid"
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/tests/photo-studio.browser.html >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/smartprint-photo-studio-qa-server.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/smartprint-photo-studio-qa-server.log"
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/smartprint-photo-studio-qa-server.log"
            echo "The isolated Android Photo Studio fixture did not become ready." >&2
            exit 1
          fi
          echo "PASS: isolated QA fixture is reachable on host port 3000"
      - name: Verify Android QA fixture is not part of the normal portal artifact
        if: ${{ !cancelled() && steps.android_photo_fixture_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Photo Studio browser QA' apps/portal/dist/tests/photo-studio.browser.html
          echo "PASS: Android fixture build contains the dedicated QA page"
      - name: Validate configured Android service origin
        id: android_origin
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get("SMARTPRINT_PUBLIC_BASE_URL", "").strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SMARTPRINT_PUBLIC_BASE_URL must be configured as the canonical public HTTPS origin.")
          print(f"Android service origin validated: {parsed.scheme}://{parsed.netloc}")
          PY
      - name: Install Android SDK 36
        id: android_sdk_install
        if: ${{ !cancelled() && steps.android_origin.outcome == 'success' && steps.java_setup.outcome == 'success' && steps.gradle_setup.outcome == 'success' && steps.android_setup.outcome == 'success' }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android JVM unit tests
        if: ${{ !cancelled() && steps.android_sdk_install.outcome == 'success' }}
        run: gradle --no-daemon --console=plain -p apps/android -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" :app:testDebugUnitTest
      - name: Build Android debug APK
        id: android_apk_build
        if: ${{ !cancelled() && steps.android_sdk_install.outcome == 'success' }}
        run: gradle --no-daemon --console=plain -p apps/android -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" :app:assembleDebug
      - name: Enable KVM for Android emulator
        id: android_kvm
        if: ${{ !cancelled() && steps.android_sdk_install.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI and installation lifecycle tests
        id: android_emulator_tests
        if: ${{ !cancelled() && steps.android_sdk_install.outcome == 'success' && steps.android_apk_build.outcome == 'success' && steps.android_kvm.outcome == 'success' && steps.android_photo_fixture_server.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/qa/android-emulator-ci.sh
      - name: Stop Android Photo Studio QA fixture server
        if: always() && steps.android_photo_fixture_server.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          pid_file="$RUNNER_TEMP/smartprint-photo-studio-qa-server.pid"
          if [[ -f "$pid_file" ]]; then
            pid="$(cat "$pid_file")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
            fi
          fi
          echo "Android Photo Studio QA fixture server cleanup complete."
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-android-test-reports
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/outputs/androidTest-results/connected/
            apps/android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload debug APK
        if: ${{ always() && steps.android_apk_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload isolated Android physical-device QA APK pair
        if: ${{ always() && steps.android_emulator_tests.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-print-android-device-qa
          path: artifacts/android-device-qa/
          if-no-files-found: error
          retention-days: 30

  publish-containers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [portal, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration
        env:
          PUBLIC_BASE_URL: https://example.invalid
          IMAGE_NAMESPACE: ghcr.io/compose-validation
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate local-only Docker Compose configuration
        env:
          POSTGRES_DB: qrtoprint
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: local-ci-validation-only
          AUTH_SIGNING_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh
          DOCUMENTS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          PUBLIC_BASE_URL: https://print.example.test
        run: docker compose -f compose.local.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - id: image_namespace
        name: Resolve lower-case GitHub Container Registry namespace
        shell: bash
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "value=$namespace" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image_namespace.outputs.value }}/smart-print-api:latest
            ${{ steps.image_namespace.outputs.value }}/smart-print-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=smart-print-api
          cache-to: type=gha,mode=max,scope=smart-print-api
      - name: Build and publish portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/portal/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image_namespace.outputs.value }}/smart-print-portal:latest
            ${{ steps.image_namespace.outputs.value }}/smart-print-portal:sha-${{ github.sha }}
          cache-from: type=gha,scope=smart-print-portal
          cache-to: type=gha,mode=max,scope=smart-print-portal

      - name: Smoke-test published containers and database migrations
        shell: bash
        run: |
          set -euo pipefail
          project="qrtoprint-smoke-${GITHUB_RUN_ID}"
          env_file=".env.ci"
          collision_api="smartprint-dns-collision-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$collision_api" >/dev/null 2>&1 || true; docker compose --project-name "$project" --env-file "$env_file" -f compose.yml logs --tail 100 || true; docker compose --project-name "$project" --env-file "$env_file" -f compose.yml down -v || true; docker network rm cloudflare-edge || true; rm -f "$env_file"' EXIT

          docker network create --driver bridge --attachable cloudflare-edge

          # Reproduce the production-shaped DNS collision: the portal joins this
          # shared edge network while SmartPrint's API stays on its private network.
          docker run --detach --name "$collision_api" --network cloudflare-edge --network-alias api nginx:alpine sh -ec "printf '%s\\n' 'server {' '  listen 8080;' '  default_type application/json;' '  location / { return 401; }' '}' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
          collision_ready=false
          for attempt in $(seq 1 30); do
            collision_probe="$(docker exec "$collision_api" wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1 || true)"
            if grep -q '401' <<< "$collision_probe"; then
              collision_ready=true
              break
            fi
            sleep 1
          done
          test "$collision_ready" = "true"

          cat > "$env_file" <<EOF
          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG=sha-${GITHUB_SHA}
          PUBLIC_BASE_URL=https://example.invalid
          POSTGRES_DB=qrtoprint
          POSTGRES_USER=qrtoprint
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          AUTH_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')
          DOCUMENTS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          EOF

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml up -d db api portal

          ready=false
          for attempt in $(seq 1 90); do
            if docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T api curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          # Prove the generic name resolves to the deliberately conflicting
          # edge-network service and returns the same class of 401 seen locally.
          collision_response="$(docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal sh -lc 'wget -S -O - http://api:8080/health/live 2>&1 || true')"
          if ! grep -q '401' <<< "$collision_response"; then
            echo "The CI fixture did not reproduce the shared-network api alias collision:" >&2
            echo "$collision_response" >&2
            exit 1
          fi

          live_response="$(docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal wget -q -O - http://127.0.0.1/health/live)"
          grep -Fq '"service":"qrtoprint-api"' <<< "$live_response"
          grep -Fq '"status":"live"' <<< "$live_response"

          ready_response="$(docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal wget -q -O - http://127.0.0.1/health/ready)"
          grep -Fq '"status":"ready"' <<< "$ready_response"
          grep -Fq '"database":"connected"' <<< "$ready_response"

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal wget -q -O /dev/null http://127.0.0.1/
          echo "API migrations, deliberate shared-network DNS collision, and Nginx liveness/readiness proxy smoke checks passed."
