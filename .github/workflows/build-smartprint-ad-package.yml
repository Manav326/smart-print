name: Build SmartPrint ad production package

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smartprint-ad-package-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download responsive browser QA screenshots from same CI run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v7
        with:
          name: smartprint-responsive-browser-qa
          path: .tmp/smartprint-responsive-browser-qa
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package metadata
        shell: bash
        run: echo "CI_RUN_ID=${{ github.event.workflow_run.id || 'manual' }}" >> "$GITHUB_ENV"

      - name: Build package and split 20 clip prompts
        run: python marketing/smartprint-ad/scripts/package_ad_assets.py

      - name: Upload complete ad production kit
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-ad-production-kit
          path: .package_out/SmartPrint_Ad_Production_Kit.zip
          if-no-files-found: error
          retention-days: 30
