name: SmartPrint MSIX validation

on:
  push:
    branches:
      - feat/store-msix-parallel-release
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/msix-validation.yml"
      - "scripts/build-msix-package.ps1"
      - "scripts/install-agent-service.ps1"
      - "scripts/uninstall-agent-service.ps1"
      - "src/SmartPrint.Agent/**"
      - "tests/SmartPrint.Agent.Tests/**"
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - "docs/MSIX_*.md"
  workflow_dispatch:
    inputs:
      package_name:
        description: Exact MSIX package identity Name reserved in Partner Center
        required: true
        type: string
      publisher:
        description: Exact MSIX package Publisher identity from Partner Center, including CN=
        required: true
        type: string
      app_display_name:
        description: Exact app display name reserved in Partner Center
        required: true
        type: string
      publisher_display_name:
        description: Exact publisher display name shown in Partner Center
        required: true
        type: string
      version:
        description: Four-part MSIX version, for example 0.1.97.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smartprint-msix-validation-${{ github.ref }}
  # Keep a costly Windows packaging run alive when another commit is pushed.
  cancel-in-progress: false

jobs:
  msix-build-install-upgrade:
    runs-on: windows-latest
    # Native build, Agent publish, MSIX packaging, install and lifecycle validation.
    timeout-minutes: 90
    env:
      SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL || 'https://example.invalid' }}
      WEBVIEW2_STANDALONE_X64_URL: ${{ vars.WEBVIEW2_STANDALONE_X64_URL || 'https://go.microsoft.com/fwlink/?linkid=2124701' }}
      MSIX_PACKAGE_NAME: ${{ inputs.package_name || 'SmartPrint.Test' }}
      MSIX_PUBLISHER: ${{ inputs.publisher || 'CN=SmartPrint MSIX CI' }}
      MSIX_APP_DISPLAY_NAME: ${{ inputs.app_display_name || 'Smart Print' }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name || 'SmartPrint CI' }}
      MSIX_VERSION: ${{ inputs.version || '0.1.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - name: Install workspace dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Workspace dependency installation failed." }
      - name: Validate MSIX PowerShell tooling syntax
        shell: pwsh
        run: |
          $scriptPaths = @(
            "scripts/build-msix-package.ps1",
            "scripts/validate-msix-wack.ps1"
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $scriptPath).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $scriptPath."
            }
            Write-Host "PowerShell syntax passed: $scriptPath"
          }

      - name: Validate production Store build inputs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $origin = [Uri]$env:SMARTPRINT_PUBLIC_BASE_URL
          if ($origin.Scheme -ne "https" -or $origin.AbsolutePath -notin @("", "/") -or $origin.Query -or $origin.Fragment -or $origin.UserInfo -or $origin.Host -eq "example.invalid") {
            throw "Set SMARTPRINT_PUBLIC_BASE_URL to the real canonical HTTPS API/portal origin before creating a Store-submission build."
          }
          foreach ($value in @($env:MSIX_PACKAGE_NAME, $env:MSIX_PUBLISHER, $env:MSIX_APP_DISPLAY_NAME, $env:MSIX_PUBLISHER_DISPLAY_NAME, $env:MSIX_VERSION)) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw "All Partner Center identity and version inputs are required." }
          }
          $versionParts = $env:MSIX_VERSION.Split('.')
          $parsedParts = @($versionParts | ForEach-Object { [int]$parsed = 0; [int]::TryParse($_, [ref]$parsed) })
          if ($versionParts.Length -ne 4 -or $parsedParts.Count -ne 4 -or @($parsedParts | Where-Object { -not $_ }).Count -gt 0) {
            throw "Partner Center MSIX version must contain exactly four numeric parts."
          }
          Write-Host "Verified production HTTPS origin and all Partner Center identity inputs."
      - name: Align desktop binary version with MSIX package version
        shell: pwsh
        run: |
          $msixVersion = [version]$env:MSIX_VERSION
          $desktopVersion = "$($msixVersion.Major).$($msixVersion.Minor).$($msixVersion.Build)"
          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.version = $desktopVersion
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
          $packagePath = "apps/desktop/package.json"
          $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $package.version = $desktopVersion
          $package | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $packagePath -Encoding utf8
          Write-Host "Desktop application version aligned to $desktopVersion (MSIX package $env:MSIX_VERSION)."
      - name: Build existing desktop frontend and native executable
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @smart-print/desktop build
          if ($LASTEXITCODE -ne 0) { throw "Desktop frontend build failed." }
          pnpm --filter @smart-print/desktop exec tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { throw "Native desktop build failed." }
          $nativeExe = "apps/desktop/src-tauri/target/release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $nativeExe)) { throw "Native desktop executable was not produced." }
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          Copy-Item -LiteralPath $nativeExe -Destination artifacts/desktop/SmartPrint.Desktop.exe
          Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release" -Filter "*.dll" -File | Copy-Item -Destination artifacts/desktop -Force
      - name: Download and verify Microsoft-signed Evergreen WebView2 runtime
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBVIEW2_STANDALONE_X64_URL)) {
            throw "Repository variable WEBVIEW2_STANDALONE_X64_URL is required to preserve the existing WebView2 prerequisite behavior in MSIX."
          }
          $runtimeUri = [Uri]$env:WEBVIEW2_STANDALONE_X64_URL
          if (-not $runtimeUri.IsAbsoluteUri -or $runtimeUri.Scheme -ne "https" -or $runtimeUri.UserInfo) {
            throw "WEBVIEW2_STANDALONE_X64_URL must be an absolute HTTPS URL without embedded credentials."
          }
          $runtimePath = "artifacts/desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri $runtimeUri -OutFile $runtimePath -MaximumRedirection 5
          $runtime = Get-Item -LiteralPath $runtimePath
          if ($runtime.Length -lt 50MB) { throw "Downloaded WebView2 standalone runtime is unexpectedly small ($($runtime.Length) bytes)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $runtimePath
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "WebView2 standalone runtime is not validly signed by Microsoft."
          }
          Write-Host "Verified Microsoft-signed Evergreen WebView2 runtime ($([math]::Round($runtime.Length / 1MB, 1)) MiB)."
      - name: Publish the existing Windows Agent unchanged
        shell: pwsh
        run: |
          dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
          if ($LASTEXITCODE -ne 0) { throw "Self-contained Agent publish failed." }
      - name: Run Agent unit tests
        shell: pwsh
        run: |
          dotnet test tests/SmartPrint.Agent.Tests/SmartPrint.Agent.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint Agent tests failed." }
      - name: Create publisher-matched MSIX signing certificate
        id: certificate
        shell: pwsh
        env:
          CERT_SUBJECT: ${{ inputs.publisher || 'CN=SmartPrint MSIX CI' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_SUBJECT)) { throw "MSIX Publisher identity is required." }
          $password = [Guid]::NewGuid().ToString("N") + "Aa1!"
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:CERT_SUBJECT -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(365)
          if ($certificate.Subject -ine $env:CERT_SUBJECT) { throw "Generated certificate subject '$($certificate.Subject)' does not exactly match requested Publisher '$env:CERT_SUBJECT'." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "smartprint-msix-ci.pfx"
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Export-Certificate -Cert $certificate -FilePath "artifacts/SmartPrint-MSIX-DevCert.cer" -Type CERT | Out-Null
          Write-Output "::add-mask::$password"
          "pfx_password=$password" >> $env:GITHUB_OUTPUT
      - name: Build, sign and verify MSIX
        timeout-minutes: 50
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ steps.certificate.outputs.pfx_password }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "smartprint-msix-ci.pfx"
          $securePassword = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          Write-Host "Importing the ephemeral publisher-matched certificate into the build-user trust stores."
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\Root" -Password $securePassword -ErrorAction Stop | Out-Null
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" -Password $securePassword -ErrorAction Stop | Out-Null
          Write-Host "Certificate trust setup completed. Starting bounded MSIX staging, compression, signing and verification."
          $arguments = @{
            DesktopDirectory = "artifacts/desktop"
            AgentDirectory = "artifacts/agent"
            OutputPath = "artifacts/SmartPrint-Windows-Store.msix"
            PackageName = $env:MSIX_PACKAGE_NAME
            Publisher = $env:MSIX_PUBLISHER
            AppDisplayName = $env:MSIX_APP_DISPLAY_NAME
            Version = $env:MSIX_VERSION
            PublicApiOrigin = $env:SMARTPRINT_PUBLIC_BASE_URL
            IconPath = "apps/desktop/src-tauri/icons/icon.ico"
            SigningCertificatePath = $pfxPath
            SigningCertificatePassword = $env:PFX_PASSWORD
            PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
          }
          ./scripts/build-msix-package.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "MSIX package builder returned a non-zero exit code." }
          if (-not (Test-Path -LiteralPath "artifacts/SmartPrint-Windows-Store.msix" -PathType Leaf)) { throw "MSIX package builder returned without producing the expected package." }
          Write-Host "MSIX package builder completed and the package file exists."
      - name: Trust development signing certificate and install MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ steps.certificate.outputs.pfx_password }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "smartprint-msix-ci.pfx"
          $securePassword = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" -Password $securePassword
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\LocalMachine\Root" -Password $securePassword | Out-Null
          if (-not $certificate) { throw "Could not trust the MSIX development signing certificate." }
          Add-AppxPackage -Path "artifacts/SmartPrint-Windows-Store.msix"
          if (-not (Get-AppxPackage -Name $env:MSIX_PACKAGE_NAME)) { throw "Windows did not register SmartPrint MSIX." }
      - name: Verify packaged service, local API, named pipe and printer subsystem
        id: service_validation
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='QRtoPrint Smart Print Agent'" -ErrorAction SilentlyContinue
            if ($service -and $service.State -eq "Running") { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $service) { throw "MSIX did not register the existing SmartPrint Agent service." }
          if ($service.StartName -notmatch "LocalService$") { throw "MSIX Agent is not running as NT AUTHORITY\LocalService." }
          if ($service.State -ne "Running") { throw "MSIX Agent did not start automatically." }

          # Record SCM crash-recovery parity without stopping the remaining
          # install/queue/network/uninstall tests. A missing restart action is
          # enforced as a final release gate after all other evidence is collected.
          $failureActions = (& sc.exe qfailure "QRtoPrint Smart Print Agent" 2>&1 | Out-String)
          $failureActionsExit = $LASTEXITCODE
          $failureFlag = (& sc.exe qfailureflag "QRtoPrint Smart Print Agent" 2>&1 | Out-String)
          $failureFlagExit = $LASTEXITCODE
          $recoveryReady = ($failureActionsExit -eq 0 -and $failureActions -match "RESTART" -and $failureFlagExit -eq 0 -and $failureFlag -match "1")
          "recovery_ready=$($recoveryReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $recoveryReady) { Write-Warning "Packaged Agent does not yet demonstrate the EXE's SCM crash-recovery configuration. Release remains blocked." }

          $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(".", "QRtoPrint.SmartPrint.Agent.Control", [System.IO.Pipes.PipeDirection]::InOut)
          try {
            $pipe.Connect(10000)
            $writer = [System.IO.StreamWriter]::new($pipe, [System.Text.UTF8Encoding]::new($false), 1024, $true)
            $reader = [System.IO.StreamReader]::new($pipe, [System.Text.UTF8Encoding]::new($false), $false, 1024, $true)
            $writer.AutoFlush = $true
            $writer.WriteLine('{"operation":"status"}')
            $response = $reader.ReadLine() | ConvertFrom-Json
            if ($response.serviceReachable -ne $true) { throw "Existing desktop-to-Agent named-pipe protocol failed." }
          } finally { $pipe.Dispose() }

          $apiReady = $false
          try {
            $localStatus = Invoke-WebRequest -Uri "http://127.0.0.1:17842/api/v1/local/status" -TimeoutSec 10 -SkipHttpErrorCheck
            $apiReady = $localStatus.StatusCode -in @(200, 503)
          } catch { $apiReady = $false }
          if (-not $apiReady) { throw "Agent did not expose its existing local API on TCP 17842." }
          $localStatusBody = $localStatus.Content | ConvertFrom-Json
          $queueDeadline = (Get-Date).AddSeconds(60)
          while ($localStatusBody.readiness.queueInitialized -ne $true -and (Get-Date) -lt $queueDeadline) {
            Start-Sleep -Seconds 3
            $localStatus = Invoke-WebRequest -Uri "http://127.0.0.1:17842/api/v1/local/status" -TimeoutSec 10 -SkipHttpErrorCheck
            $localStatusBody = $localStatus.Content | ConvertFrom-Json
          }
          if ($localStatusBody.readiness.queueInitialized -ne $true) { throw "The LocalService Agent could not initialize its protected machine-wide print queue." }
          $queueRoot = Join-Path $env:ProgramData "QRtoPrint\LocalQueue"
          if (-not (Test-Path -LiteralPath $queueRoot -PathType Container)) { throw "The protected LocalService print queue directory was not created." }
          $queueAcl = Get-Acl -LiteralPath $queueRoot
          $localServiceAccess = @($queueAcl.Access | Where-Object { $_.IdentityReference -match "LOCAL SERVICE" -and $_.FileSystemRights.ToString() -match "FullControl" })
          $systemAccess = @($queueAcl.Access | Where-Object { $_.IdentityReference -match "SYSTEM" -and $_.FileSystemRights.ToString() -match "FullControl" })
          if ($localServiceAccess.Count -eq 0 -or $systemAccess.Count -eq 0) { throw "The protected queue ACL does not grant FullControl only to its required service/system principals." }

          $package = Get-AppxPackage -Name $env:MSIX_PACKAGE_NAME
          $agentPath = Join-Path $package.InstallLocation "Agent\SmartPrint.Agent.exe"
          $firewallMatches = foreach ($rule in Get-NetFirewallRule -Direction Inbound -Enabled True) {
            $appFilter = Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue
            $portFilter = Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue
            if ($appFilter.Program -eq $agentPath -and $portFilter.Protocol -eq "TCP" -and $portFilter.LocalPort -eq "17842") { $rule }
          }
          if (-not $firewallMatches) { throw "MSIX did not register an inbound firewall rule for the Agent TCP 17842 endpoint." }
          if (@($firewallMatches | Where-Object { $_.Profile -notcontains "Any" }).Count -gt 0) { throw "MSIX Agent firewall rule does not cover all Windows network profiles." }

          $webView2Guid = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $webView2Paths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$webView2Guid",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$webView2Guid"
          )
          $webView2Versions = foreach ($path in $webView2Paths) {
            try { (Get-ItemProperty -LiteralPath $path -Name "pv" -ErrorAction Stop).pv } catch { }
          }
          $validWebView2 = @($webView2Versions | Where-Object {
            try { [version]$_ -gt [version]"0.0.0.0" } catch { $false }
          })
          if ($validWebView2.Count -eq 0) { throw "The Windows runner has no registered Evergreen WebView2 Runtime; MSIX desktop startup cannot be validated." }
          Write-Host "Verified Evergreen WebView2 Runtime: $($validWebView2[0])"
          $printers = Get-CimInstance -ClassName Win32_Printer -ErrorAction Stop
          Write-Host "Windows printer subsystem query succeeded; installed printer count: $(@($printers).Count)"
          if (-not (Test-Path -LiteralPath "$env:ProgramData\QRtoPrint")) { throw "Agent did not initialize persistent machine data." }
          $uninstallMarker = Join-Path $env:ProgramData "QRtoPrint\msix-uninstall-preservation-test.txt"
          Set-Content -LiteralPath $uninstallMarker -Value "preserve-across-msix-uninstall" -Encoding utf8
      - name: Verify upgrade preserves machine data and LocalService Agent
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ steps.certificate.outputs.pfx_password }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "smartprint-msix-ci.pfx"
          $marker = Join-Path $env:ProgramData "QRtoPrint\msix-upgrade-preservation-test.txt"
          Set-Content -LiteralPath $marker -Value "preserve-across-msix-upgrade" -Encoding utf8
          $arguments = @{
            DesktopDirectory = "artifacts/desktop"
            AgentDirectory = "artifacts/agent"
            OutputPath = "artifacts/SmartPrint-Windows-Store-Upgrade.msix"
            PackageName = $env:MSIX_PACKAGE_NAME
            Publisher = "CN=SmartPrint MSIX CI"
            AppDisplayName = "Smart Print"
            Version = "0.1.1.0"
            PublicApiOrigin = $env:SMARTPRINT_PUBLIC_BASE_URL
            IconPath = "apps/desktop/src-tauri/icons/icon.ico"
            SigningCertificatePath = $pfxPath
            SigningCertificatePassword = $env:PFX_PASSWORD
            PublisherDisplayName = "SmartPrint CI"
          }
          ./scripts/build-msix-package.ps1 @arguments
          Add-AppxPackage -Path "artifacts/SmartPrint-Windows-Store-Upgrade.msix"
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='QRtoPrint Smart Print Agent'" -ErrorAction SilentlyContinue
            if ($service -and $service.State -eq "Running") { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $service -or $service.State -ne "Running" -or $service.StartName -notmatch "LocalService$") { throw "MSIX upgrade did not retain a running LocalService Agent." }
          if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne "preserve-across-msix-upgrade") { throw "MSIX upgrade modified persistent machine data." }
      - name: Verify uninstall removes service but preserves machine data
        if: always()
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:MSIX_PACKAGE_NAME -ErrorAction SilentlyContinue
          if ($package) { Remove-AppxPackage -Package $package.PackageFullName -ErrorAction Stop }
          $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='QRtoPrint Smart Print Agent'" -ErrorAction SilentlyContinue
          if ($service) { throw "MSIX uninstall left the Agent service registered." }
          $marker = Join-Path $env:ProgramData "QRtoPrint\msix-upgrade-preservation-test.txt"
          if (Test-Path -LiteralPath $marker) {
            Write-Host "Verified: machine data survives MSIX uninstall."
            Remove-Item -LiteralPath $marker -Force
          }
          if ("${{ steps.service_validation.outcome }}" -eq "success") {
          $uninstallMarker = Join-Path $env:ProgramData "QRtoPrint\msix-uninstall-preservation-test.txt"
          if (-not (Test-Path -LiteralPath $uninstallMarker)) { throw "MSIX uninstall did not preserve the machine data directory." }
          if ((Get-Content -LiteralPath $uninstallMarker -Raw).Trim() -ne "preserve-across-msix-uninstall") { throw "MSIX uninstall modified the machine data marker." }
          Remove-Item -LiteralPath $uninstallMarker -Force
          }
      - name: Enforce service recovery release gate
        if: success()
        shell: pwsh
        run: |
          if ("${{ steps.service_validation.outputs.recovery_ready }}" -ne "true") {
            throw "MSIX service crash-recovery parity is not proven. Do not release or submit this package."
          }
      - name: Upload Store-submission MSIX and public test certificate
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smartprint-msix-${{ inputs.version }}
          path: |
            artifacts/SmartPrint-Windows-Store.msix
            artifacts/SmartPrint-MSIX-DevCert.cer
          if-no-files-found: error
          retention-days: 30
