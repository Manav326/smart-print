name: Publish SmartPrint to Microsoft Store and Google Play

on:
  push:
    paths:
      - ".github/workflows/store-publish.yml"
  pull_request:
    paths:
      - ".github/workflows/store-publish.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag (for example v1.2.0)
        required: true
        type: string
      publish_windows:
        description: Submit the signed Windows installer to Microsoft Store
        required: false
        default: false
        type: boolean
      publish_android:
        description: Upload the Android App Bundle to Google Play
        required: false
        default: false
        type: boolean
      android_track:
        description: Google Play release track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - closed
          - production
      confirm_publication:
        description: Explicitly authorize the selected Store submission(s)
        required: true
        default: false
        type: boolean

concurrency:
  group: smartprint-store-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow-validation:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse release workflow YAML and all inline PowerShell blocks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python - <<'PY'
          import os
          import pathlib
          import textwrap
          import yaml

          root = pathlib.Path(".")
          workflow_paths = [
              root / ".github/workflows/store-publish.yml",
              root / ".github/workflows/release.yml",
          ]
          expected = {"validate", "microsoft-store", "google-play", "workflow-validation"}
          extracted = 0
          for path in workflow_paths:
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.get("jobs"), dict):
                  raise SystemExit(f"{path} must contain a jobs mapping.")
              if path.name == "store-publish.yml":
                  missing = expected.difference(data["jobs"])
                  if missing:
                      raise SystemExit(f"Missing Store publishing jobs: {sorted(missing)}")
              for job_name, job in data["jobs"].items():
                  for index, step in enumerate(job.get("steps", [])):
                      shell = str(step.get("shell", "")).lower()
                      source = step.get("run")
                      if shell in ("pwsh", "powershell") and isinstance(source, str):
                          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"smartprint-workflow-{path.stem}-{job_name}-{index}.ps1"
                          target.write_text(textwrap.dedent(source), encoding="utf-8")
                          extracted += 1
          print(f"Parsed workflow YAML and extracted {extracted} inline PowerShell scripts for syntax validation.")
          PY
          pwsh -NoProfile -Command '
          $files = Get-ChildItem $env:RUNNER_TEMP -Filter "smartprint-workflow-*.ps1" -File
          if ($files.Count -eq 0) { throw "No inline PowerShell blocks were extracted." }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($file.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)"
              }
              throw "Inline PowerShell syntax validation failed for $($file.Name)."
            }
          }
          Write-Host "All inline PowerShell blocks in release.yml and store-publish.yml parsed successfully."
          '

  validate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.verify-release-tag.outputs.source_sha }}
    steps:
      - name: Require dispatch from the protected main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Store publication must be dispatched from main."
            exit 1
          fi
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - id: verify-release-tag
        name: Verify the release tag and publication confirmation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
          PUBLISH_WINDOWS: ${{ inputs.publish_windows }}
          PUBLISH_ANDROID: ${{ inputs.publish_android }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Use a stable semantic version tag such as v1.2.0."
            exit 1
          }
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::The selected release tag must resolve to a commit reachable from main."
            exit 1
          fi
          echo "source_sha=$tag_commit" >> "$GITHUB_OUTPUT"
          [[ "$CONFIRM_PUBLICATION" == "true" ]] || {
            echo "::error::Set confirm_publication=true only after reviewing the release artifacts."
            exit 1
          }
          [[ "$PUBLISH_WINDOWS" == "true" || "$PUBLISH_ANDROID" == "true" ]] || {
            echo "::error::Select at least one Store."
            exit 1
          }

  microsoft-store:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows }}
    runs-on: windows-latest
    environment: microsoft-store-production
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_DOWNLOAD_BASE_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
      MICROSOFT_STORE_SELLER_ID: ${{ vars.MICROSOFT_STORE_SELLER_ID }}
      MICROSOFT_STORE_TENANT_ID: ${{ vars.MICROSOFT_STORE_TENANT_ID }}
      MICROSOFT_STORE_CLIENT_ID: ${{ vars.MICROSOFT_STORE_CLIENT_ID }}
      SMARTPRINT_WINDOWS_PUBLISHER: ${{ vars.SMARTPRINT_WINDOWS_PUBLISHER }}
      MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Download the signed Windows Store artifact from the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghVersionText = (gh --version | Select-Object -First 1)
          $ghVersion = [regex]::Match($ghVersionText, "[0-9]+[.][0-9]+[.][0-9]+").Value
          if ([string]::IsNullOrWhiteSpace($ghVersion) -or [version]$ghVersion -lt [version]"2.102.0") {
            throw "GitHub CLI 2.102.0 or newer is required for secure artifact-attestation verification."
          }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts --pattern "SmartPrint-Windows-Store-Setup.exe" --pattern "SHA256SUMS.txt" --pattern "BUILD-INFO.txt"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the Store-ready Windows installer from the published GitHub release." }
          if (-not (Test-Path "artifacts/SmartPrint-Windows-Store-Setup.exe")) { throw "The signed Store-ready Windows installer is missing from this release." }
          if (-not (Test-Path "artifacts/SHA256SUMS.txt")) { throw "The release checksum manifest is missing." }
          if (-not (Test-Path "artifacts/BUILD-INFO.txt")) { throw "The release build provenance file is missing." }
          $buildInfoHash = (Get-FileHash "artifacts/BUILD-INFO.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
          $buildInfoExpected = (Get-Content "artifacts/SHA256SUMS.txt" | Where-Object { $_ -match "\s+\*?BUILD-INFO\.txt$" } | Select-Object -First 1)
          if (-not $buildInfoExpected -or $buildInfoHash -ne (($buildInfoExpected -split "\s+")[0]).ToLowerInvariant()) { throw "Release build provenance checksum verification failed." }
          $sourceLine = Get-Content "artifacts/BUILD-INFO.txt" | Where-Object { $_ -match "^source_commit=" } | Select-Object -First 1
          if (-not $sourceLine -or $sourceLine.Substring("source_commit=".Length) -ne $env:RELEASE_SOURCE_SHA) { throw "Release artifacts were not built from the exact validated release tag commit." }
          $expected = (Get-Content "artifacts/SHA256SUMS.txt" | Where-Object { $_ -match "\s+\*?SmartPrint-Windows-Store-Setup\.exe$" } | Select-Object -First 1)
          if (-not $expected) { throw "No SHA-256 checksum exists for the Store installer." }
          $parts = $expected -split "\s+"
          $actual = (Get-FileHash "artifacts/SmartPrint-Windows-Store-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Store installer checksum verification failed." }
          gh attestation verify "artifacts/SmartPrint-Windows-Store-Setup.exe" --repo $env:GITHUB_REPOSITORY --signer-workflow "${env:GITHUB_REPOSITORY}/.github/workflows/release.yml" --source-digest $env:RELEASE_SOURCE_SHA --deny-self-hosted-runners --predicate-type "https://slsa.dev/provenance/v1"
          if ($LASTEXITCODE -ne 0) { throw "The Store installer does not have a valid attestation from the approved release workflow." }
          $signature = Get-AuthenticodeSignature -LiteralPath "artifacts/SmartPrint-Windows-Store-Setup.exe"
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Store installer Authenticode signature is not valid." }
          if ([string]::IsNullOrWhiteSpace($env:SMARTPRINT_WINDOWS_PUBLISHER) -or $signature.SignerCertificate.Subject -notmatch [regex]::Escape($env:SMARTPRINT_WINDOWS_PUBLISHER)) { throw "Store installer signer does not contain the configured Partner Center publisher identity." }

      - name: Require complete Microsoft Store and R2 configuration
        shell: pwsh
        run: |
          $required = @(
            "PUBLIC_DOWNLOAD_BASE_URL", "CLOUDFLARE_R2_ACCOUNT_ID", "CLOUDFLARE_R2_BUCKET",
            "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "MICROSOFT_STORE_PRODUCT_ID",
            "MICROSOFT_STORE_SELLER_ID", "MICROSOFT_STORE_TENANT_ID",
            "MICROSOFT_STORE_CLIENT_ID", "MICROSOFT_STORE_CLIENT_SECRET", "SMARTPRINT_WINDOWS_PUBLISHER"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Missing GitHub Actions variables/secrets: $($missing -join ', ')." }
          $origin = [Uri]$env:PUBLIC_DOWNLOAD_BASE_URL
          if ($origin.Scheme -ne "https" -or $origin.AbsolutePath -notin @("", "/") -or $origin.Query -or $origin.Fragment -or $origin.UserInfo) {
            throw "PUBLIC_DOWNLOAD_BASE_URL must be a canonical HTTPS custom-domain origin without path, query, fragment or embedded credentials."
          }
          if ($env:CLOUDFLARE_R2_ACCOUNT_ID -notmatch "^[0-9a-fA-F]{32}$") { throw "CLOUDFLARE_R2_ACCOUNT_ID must be 32 hexadecimal characters." }

      - name: Upload immutable installer to the configured public R2 origin
        shell: pwsh
        run: |
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) { choco install awscli --no-progress -y }
          $endpoint = "https://$env:CLOUDFLARE_R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $file = "artifacts/SmartPrint-Windows-Store-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $key = "$env:RELEASE_TAG/SmartPrint-Windows-Store-Setup.exe"
          $existingJson = aws s3api head-object --bucket $env:CLOUDFLARE_R2_BUCKET --key $key --endpoint-url $endpoint --region auto --output json 2>&1
          $headExitCode = $LASTEXITCODE
          if ($headExitCode -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if ($existing.Metadata.sha256 -ne $hash -or $existing.ContentLength -ne (Get-Item $file).Length) {
              throw "Refusing to overwrite an immutable R2 Store package URL for this release tag."
            }
            Write-Host "The immutable Store package already exists with the same SHA-256; leaving it unchanged."
          } elseif (($existingJson -join " ") -match "(404|NotFound|NoSuchKey)") {
            aws s3 cp $file "s3://$env:CLOUDFLARE_R2_BUCKET/$key" --endpoint-url $endpoint --region auto --only-show-errors --content-type "application/octet-stream" --content-disposition 'attachment; filename="SmartPrint-Windows-Store-Setup.exe"' --cache-control "public, max-age=31536000, immutable" --metadata "sha256=$hash"
            if ($LASTEXITCODE -ne 0) { throw "Cloudflare R2 upload failed." }
            $headJson = aws s3api head-object --bucket $env:CLOUDFLARE_R2_BUCKET --key $key --endpoint-url $endpoint --region auto --output json
            if ($LASTEXITCODE -ne 0) { throw "Cloudflare R2 object could not be verified after upload." }
            $head = $headJson | ConvertFrom-Json
            if ($head.Metadata.sha256 -ne $hash -or $head.ContentLength -ne (Get-Item $file).Length) {
              throw "Cloudflare R2 object verification failed."
            }
          } else {
            throw "Could not safely check whether the immutable R2 Store package exists: $($existingJson -join ' ')"
          }
          $verifiedCopy = Join-Path $env:RUNNER_TEMP "SmartPrint-Windows-Store-Setup-R2-verified.exe"
          aws s3 cp "s3://$env:CLOUDFLARE_R2_BUCKET/$key" $verifiedCopy --endpoint-url $endpoint --region auto --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw "Could not download the stored Microsoft Store package for byte-for-byte verification." }
          $storedHash = (Get-FileHash $verifiedCopy -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($storedHash -ne $hash) { throw "The stored Microsoft Store package bytes do not match the signed release artifact." }
          Remove-Item -LiteralPath $verifiedCopy -Force
          $publicUrl = "$($env:PUBLIC_DOWNLOAD_BASE_URL.TrimEnd('/'))/$env:RELEASE_TAG/SmartPrint-Windows-Store-Setup.exe"
          $probeFile = Join-Path $env:RUNNER_TEMP "SmartPrint-Store-public-range-probe.bin"
          $response = Invoke-WebRequest -Uri $publicUrl -Method Get -Headers @{ Range = "bytes=0-0" } -OutFile $probeFile -MaximumRedirection 5
          if ($response.StatusCode -ne 206) { throw "Public Store installer URL did not honor a one-byte HTTP range request (expected 206)." }
          if ($response.Headers["Content-Range"] -notmatch "^bytes 0-0/(\d+)$") { throw "Public Store installer URL returned an invalid Content-Range header." }
          $publicLength = [Int64]$Matches[1]
          if ($publicLength -ne (Get-Item $file).Length) { throw "Public Store installer URL reports a different content length than the signed release artifact." }
          if ((Get-Item $probeFile).Length -ne 1) { throw "Public Store installer URL returned an invalid range response body." }
          $localStream = [System.IO.File]::OpenRead($file)
          $probeStream = [System.IO.File]::OpenRead($probeFile)
          try {
            if ($localStream.ReadByte() -ne $probeStream.ReadByte()) { throw "Public Store installer URL did not serve the expected artifact bytes." }
          }
          finally {
            $localStream.Dispose()
            $probeStream.Dispose()
          }
          Remove-Item -LiteralPath $probeFile -Force
          "WINDOWS_STORE_PACKAGE_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "Verified immutable public installer URL and byte-range delivery: $publicUrl"

      - name: Submit Windows package for Microsoft certification
        shell: pwsh
        run: |
          ./scripts/publish-microsoft-store.ps1 -ReleaseTag $env:RELEASE_TAG -ProductId $env:MICROSOFT_STORE_PRODUCT_ID -SellerAccountId $env:MICROSOFT_STORE_SELLER_ID -TenantId $env:MICROSOFT_STORE_TENANT_ID -ClientId $env:MICROSOFT_STORE_CLIENT_ID -ClientSecret $env:MICROSOFT_STORE_CLIENT_SECRET -PublicDownloadBaseUrl $env:PUBLIC_DOWNLOAD_BASE_URL

  google-play:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_android }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.android_track == 'production' && 'google-play-production' || 'google-play-testing' }}
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Download the signed Android App Bundle from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern "SmartPrint-Android.aab" --pattern "SHA256SUMS.txt" --pattern "BUILD-INFO.txt"
          test -s artifacts/SmartPrint-Android.aab
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/BUILD-INFO.txt
          grep -E 'SmartPrint-Android[.]aab|BUILD-INFO[.]txt' artifacts/SHA256SUMS.txt | (cd artifacts && sha256sum --check)
          grep -Fx "source_commit=$RELEASE_SOURCE_SHA" artifacts/BUILD-INFO.txt
          gh_version="$(gh --version | awk 'NR == 1 { print $3 }')"
          if [[ "$(printf '%s\n' 2.102.0 "$gh_version" | sort -V | head -n 1)" != "2.102.0" ]]; then
            echo "::error::GitHub CLI 2.102.0 or newer is required for secure artifact-attestation verification."
            exit 1
          fi
          gh attestation verify artifacts/SmartPrint-Android.aab --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$RELEASE_SOURCE_SHA" --deny-self-hosted-runners --predicate-type "https://slsa.dev/provenance/v1"

      - name: Upload Android App Bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.quantaedge.smartprint
          releaseFiles: artifacts/SmartPrint-Android.aab
          tracks: ${{ inputs.android_track }}
          releaseName: ${{ inputs.release_tag }}
          status: ${{ inputs.android_track == 'production' && 'inProgress' || 'completed' }}
          userFraction: ${{ inputs.android_track == 'production' && '0.1' || '' }}
