<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      (() => {
        let theme = "light";
        try {
          theme = localStorage.getItem("qrtoprint.theme") === "dark" ? "dark" : "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const color = document.querySelector('meta[name="theme-color"]');
        if (color) color.content = theme === "dark" ? "#0c0f16" : "#f4f6fa";
      })();
    </script>
    <meta name="description" content="SmartPrint connects local print shops and customers. Scan a shop QR code, send documents and manage print jobs in one seamless workflow." />
    <meta property="og:title" content="SmartPrint — From their phone to your printer" />
    <meta property="og:description" content="A simpler way for customers and local print shops to connect and print." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/branding/smartprint-app-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <title>SmartPrint — From their phone to your printer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
