<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-labelledby="title desc">
  <title id="title">SmartPrint by QuantaEdge</title>
  <desc id="desc">SmartPrint wordmark with the QuantaEdge parent-brand signature beneath it. All lettering is on a transparent background.</desc>
  <defs>
    <linearGradient id="printer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#4B2CBF"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#7258E8"/></linearGradient>
  </defs>
  <g transform="translate(0 0) scale(.62)">
    <path d="M31 164 C25 190 39 213 67 225 C117 246 192 222 225 183" fill="none" stroke="url(#flow)" stroke-width="10" stroke-linecap="round"/>
    <path d="M76 33 H157 L180 56 V117 H76 Z" fill="#FFFFFF" stroke="#7258E8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M157 33 V56 H180" fill="none" stroke="#C9C0FF" stroke-width="5" stroke-linejoin="round"/>
    <rect x="34" y="83" width="188" height="103" rx="27" fill="url(#printer)"/>
    <path d="M74 108 H171" fill="none" stroke="#E9E5FF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="193" cy="132" r="6" fill="#FFFFFF"/>
    <path d="M75 157 H181 V216 H75 Z" fill="#FFFFFF" stroke="#7258E8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M98 176 H158 M98 193 H148" fill="none" stroke="#7258E8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="166" y="83" font-family="Manrope, Inter, Segoe UI, sans-serif" font-size="54" font-weight="800" letter-spacing="-2.3" fill="#152038">Smart<tspan fill="#7258E8">Print</tspan></text>
  <text x="313" y="130" text-anchor="middle" font-family="Manrope, Inter, Segoe UI, sans-serif" font-weight="800">
    <tspan font-size="21" font-weight="650" fill="#667085">by </tspan><tspan font-size="27" fill="#152038">Quanta</tspan><tspan font-size="27" fill="#F97316" stroke="#913B0B" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">Edge</tspan>
