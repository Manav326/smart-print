 # Keep the existing Compose project name to preserve deployed database and document volumes.
name: qrtoprint

services:
  clamav:
    # Official ClamAV image; signatures are refreshed by the bundled freshclam daemon.
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    volumes:
      - qrtoprint_clamav_database:/var/lib/clamav
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --config-file=/etc/clamav/clamd.conf /dev/null >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  document-worker-token:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes:
      - qrtoprint_document_worker_token:/run/secrets
    command:
      - sh
      - -ec
      - |
        umask 077
        if [ ! -s /run/secrets/document-worker-token ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /run/secrets/document-worker-token
        fi
        chmod 0444 /run/secrets/document-worker-token

  document-worker:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/smart-print-document-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.document-worker
      args:
        SOURCE_REPOSITORY: ${GITHUB_REPOSITORY_URL:-}
    restart: unless-stopped
    init: true
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - qrtoprint_document_worker_token:/run/secrets:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8090
      DocumentWorker__TokenFile: /run/secrets/document-worker-token
    networks:
      - document-processing
    depends_on:
      document-worker-token:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/smartprint-document-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrtoprint}
      POSTGRES_USER: ${POSTGRES_USER:-qrtoprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - qrtoprint_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrtoprint} -d ${POSTGRES_DB:-qrtoprint}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    networks:
      default:
        aliases:
          - smart-print-api
      document-processing: {}
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/smart-print-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__SmartPrint: "Host=db;Port=5432;Database=${POSTGRES_DB:-qrtoprint};Username=${POSTGRES_USER:-qrtoprint};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}
      Documents__EncryptionKey: ${DOCUMENTS_ENCRYPTION_KEY:?Set DOCUMENTS_ENCRYPTION_KEY in .env}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      Documents__StorageRoot: /var/lib/qrtoprint/documents
      DocumentSecurity__ClamAv__Host: clamav
      DocumentSecurity__ClamAv__Port: 3310
      DocumentSecurity__ClamAv__TimeoutSeconds: 90
      DocumentSecurity__AnalysisWorker__BaseUrl: http://document-worker:8090/
      DocumentSecurity__AnalysisWorker__TokenFile: /run/secrets/document-worker-token
      Database__ApplyMigrationsOnStartup: "true"
      PublicPortal__BaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      PublicDownloads__GitHubRepository: ${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
    volumes:
      - qrtoprint_documents:/var/lib/qrtoprint/documents
      - qrtoprint_document_worker_token:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      document-worker-token:
        condition: service_completed_successfully
      document-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  portal:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/smart-print-portal:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    networks:
      default: {}
      cloudflare-edge:
        aliases:
          - smart-print-portal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  qrtoprint_database:
  qrtoprint_documents:
  qrtoprint_clamav_database:
  qrtoprint_document_worker_token:

networks:
  document-processing:
    internal: true
  cloudflare-edge:
    external: true
    name: cloudflare-edge
