 # SmartPrint runtime identity. Explicit volume names preserve the existing local database and documents during the project rename.
name: smart-print

services:
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    volumes:
      - smart_print_clamav_database:/var/lib/clamav
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --config-file=/etc/clamav/clamd.conf /dev/null >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  document-worker-token:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes:
      - smart_print_document_worker_token:/run/secrets
    command:
      - sh
      - -ec
      - |
        umask 077
        if [ ! -s /run/secrets/document-worker-token ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /run/secrets/document-worker-token
        fi
        chmod 0444 /run/secrets/document-worker-token

  document-worker:
    image: localhost/smart-print/smart-print-document-worker:local
    build:
      context: .
      dockerfile: Dockerfile.document-worker
    restart: unless-stopped
    init: true
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - smart_print_document_worker_token:/run/secrets:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8090
      DocumentWorker__TokenFile: /run/secrets/document-worker-token
    networks:
      - document-processing
    depends_on:
      document-worker-token:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/smartprint-document-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrtoprint}
      POSTGRES_USER: ${POSTGRES_USER:-qrtoprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrtoprint-local-only-db-password}
    volumes:
      - smart_print_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrtoprint} -d ${POSTGRES_DB:-qrtoprint}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    networks:
      default:
        aliases:
          - smart-print-api
      document-processing: {}
    image: localhost/smart-print/smart-print-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SmartPrint: "Host=db;Port=5432;Database=${POSTGRES_DB:-qrtoprint};Username=${POSTGRES_USER:-qrtoprint};Password=${POSTGRES_PASSWORD:-qrtoprint-local-only-db-password}"
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      Documents__EncryptionKey: ${DOCUMENTS_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      Documents__StorageRoot: /var/lib/qrtoprint/documents
      DocumentSecurity__ClamAv__Host: clamav
      DocumentSecurity__ClamAv__Port: 3310
      DocumentSecurity__ClamAv__TimeoutSeconds: 90
      DocumentSecurity__AnalysisWorker__BaseUrl: http://document-worker:8090/
      DocumentSecurity__AnalysisWorker__TokenFile: /run/secrets/document-worker-token
      Database__ApplyMigrationsOnStartup: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      PublicPortal__BaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.local}
      PublicDownloads__GitHubRepository: ${GITHUB_REPOSITORY:-Manav326/smart-print}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.local}
      Cors__AllowedOrigins__1: "http://localhost:3000"
      Cors__AllowedOrigins__2: "${SMARTPRINT_LOCAL_ORIGIN:-http://127.0.0.1:3000}"
    # Keep the API private to the Compose network. The portal proxies /api and /health
    # to smart-print-api:8080; publishing host port 8080 would collide with other local products.
    volumes:
      - smart_print_documents:/var/lib/qrtoprint/documents
      - smart_print_document_worker_token:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      document-worker-token:
        condition: service_completed_successfully
      document-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  portal:
    image: localhost/smart-print/smart-print-portal:local
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_ENABLE_PHOTO_STUDIO_QA: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      default: {}
      cloudflare-edge:
        aliases:
          - smart-print-portal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # These are the existing persistent data volumes from the pre-rename stack.
  # Mark them external so Compose reuses them regardless of the new project name
  # and does not try to adopt/recreate data owned by the old Compose project.
  smart_print_database:
    external: true
    name: qrtoprint-local_qrtoprint_local_database
  smart_print_documents:
    external: true
    name: qrtoprint-local_qrtoprint_local_documents
  smart_print_clamav_database:
  smart_print_document_worker_token:

networks:
  document-processing:
    internal: true
  cloudflare-edge:
    external: true
    name: cloudflare-edge
